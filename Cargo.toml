[package]
name = "theapp"
version = "0.1.0"
edition = "2024"
default-run = "theapp"

[dependencies]
rust-cef = { path = "../rust-cef" }
rust-embed = { version = "8.5", features = ["debug-embed"] }

tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "6"

[workspace]
members = ["xtask"]

# rust-cef selects app:// assets when debug assertions are disabled.
[profile.dev.package.rust-cef]
debug-assertions = false
