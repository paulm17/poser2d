<!doctype html><meta charset="utf-8"><title>Wooden mannequin clearance correction</title><style>body{background:#242428;color:white;font:15px system-ui}iframe{width:1100px;height:800px}button{padding:12px}pre{white-space:pre-wrap}</style><button id="run">Solve measured wooden mannequin overlaps</button><pre id="status">Ready</pre><iframe src="../../scene-builder/index.html"></iframe>
<script type="module">
const iframe=document.querySelector('iframe'),status=document.querySelector('#status'),root='../assets/ual-library/',raf=()=>new Promise(r=>requestAnimationFrame(r));async function until(fn){const end=performance.now()+60000;while(!fn()){if(performance.now()>end)throw Error('Editor timeout');await raf();}}async function json(u){const r=await fetch(u);if(!r.ok)throw Error(u);return r.json();}async function post(route,id,frame,data,binary=false){const r=await fetch('/__limb-audit/'+route+'?'+new URLSearchParams({editor:'legacy',id,frame}),{method:'POST',headers:{'Content-Type':binary?'application/octet-stream':'application/json'},body:binary?data:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json();}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{await until(()=>iframe.contentWindow.sceneBuilderEditor);const w=iframe.contentWindow,doc=w.document,editor=w.sceneBuilderEditor,T=editor.three,model=editor.selected,point=new T.Vector3();const groups={},meshes=[];let count=0;for(const side of ['l','r'])for(const part of ['arm','leg']){const faces=[];model[side+'_'+part].traverse(mesh=>{if(!mesh.isMesh||!mesh.visible||!mesh.geometry?.attributes.position)return;const n=mesh.geometry.attributes.position.count,idx=mesh.geometry.index?.array||Array.from({length:n},(_,i)=>i);meshes.push({mesh,offset:count});for(let i=0;i<idx.length;i+=3)faces.push([count+idx[i],count+idx[i+1],count+idx[i+2]]);count+=n;});groups[part+'_'+side]=faces;}await post('topology','',0,groups);
function geometry(){model.updateMatrixWorld(true);const values=new Float32Array(count*3);for(const {mesh,offset}of meshes){const a=mesh.geometry.attributes.position;for(let i=0;i<a.count;i++){point.fromBufferAttribute(a,i).applyMatrix4(mesh.matrixWorld).multiplyScalar(.01);values.set(point.toArray(),(offset+i)*3);}}return values.buffer;}
const batch=await json(root+'limb-repair-batch.json');let repaired=0;
for(const row of batch.actions){const report=await json('../docs/ual-fit/limb-clearance/batch-app/'+row.id+'/legacy/comparison.json').catch(()=>null);if(!report||report.pass)continue;const id=row.id,clip=await json(root+id+'/'+id+'-frames.json'),fit=await json(root+id+'/fit-report.json'),failures=await json('../docs/ual-fit/limb-clearance/batch-app/'+id+'/legacy/limb-intersections.json');doc.querySelector('#btn-pose2').click();await until(()=>doc.querySelector('dialog[open] .pose-thumbnail'));const choice=[...doc.querySelectorAll('dialog[open] .pose-thumbnail')].find(b=>b.title==='UAL'+clip.library+': '+clip.action);choice.click();await until(()=>!doc.querySelector('dialog[open]')&&model.userData.poseFrame?.id===id);const input=doc.querySelector('#animation-frame-panel input[type=number]');const proposals={};
for(const failure of failures.frames.filter(f=>Object.keys(f.intersections).length)){const f=failure.frame;input.value=String(f);input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.Event('blur'));await raf();const baseline={l:model.l_arm.quaternion.clone(),r:model.r_arm.quaternion.clone()},worldBase={l:model.l_arm.getWorldQuaternion(new T.Quaternion()),r:model.r_arm.getWorldQuaternion(new T.Quaternion())};let check=await post('frame',id,f,geometry(),true);const corrections={l:[0,0,0,1],r:[0,0,0,1]};
for(const side of ['l','r']){if(check.pass)break;if(!Object.keys(check.intersections).some(pair=>pair.includes('arm_'+side)))continue;const node=model[side+'_arm'],pivot=node.getWorldPosition(new T.Vector3()),lateral=pivot.clone().sub(model[(side==='l'?'r':'l')+'_arm'].getWorldPosition(new T.Vector3())).normalize(),up=model.neck.getWorldPosition(new T.Vector3()).sub(model.pelvis.getWorldPosition(new T.Vector3())).normalize(),forward=lateral.clone().cross(up).normalize().multiplyScalar(side==='l'?1:-1),parent=node.parent.getWorldQuaternion(new T.Quaternion()),initial=node.getWorldQuaternion(new T.Quaternion());let best=null;
for(const degrees of [.5,1,1.5,2,3,4,6,8,10,12,16,20]){for(const basis of ['wrist','elbow']){const direction=model[side+'_'+basis].getWorldPosition(new T.Vector3()).sub(pivot);for(const bias of [0,-1,1,-3,3,-100,100])for(const sign of [1,-1]){const target=lateral.clone().addScaledVector(forward,bias).normalize(),axis=direction.clone().cross(target).normalize();if(axis.lengthSq()<.5)continue;const q=new T.Quaternion().setFromAxisAngle(axis,T.MathUtils.degToRad(sign*degrees));node.quaternion.copy(parent.clone().invert().multiply(q.clone().multiply(initial)));const test=await post('frame',id,f,geometry(),true);const remaining=Object.keys(test.intersections).filter(pair=>pair.includes('arm_'+side));if(!remaining.length){best=q;check=test;break;}}if(best)break;}if(best)break;}
if(!best){node.quaternion.copy(baseline[side]);throw Error('No bounded original-mannequin correction '+id+' '+f+' '+side);}corrections[side]=best.toArray();node.quaternion.copy(parent.clone().invert().multiply(best.clone().multiply(initial)));model.updateMatrixWorld(true);
}
check=await post('frame',id,f,geometry(),true);if(!check.pass)throw Error('Unresolved '+id+' '+f);proposals[f]={baseClipSHA256:fit.limbClearance.clipSHA256,corrections};repaired++;status.textContent=id+' frame '+f+' corrected';}
await post('metrics',id,clip.end,{...report,legacyRepairProposals:proposals});
}
status.textContent='Generated '+repaired+' measured frame corrections. Publish and verify through the normal app controls.';
}catch(e){status.textContent='FAILED: '+e.stack;}};
</script>
