<!doctype html><meta charset="utf-8"><title>UAL full limb repair verification</title><style>body{background:#242428;color:white;font:15px system-ui}button{padding:12px}iframe{width:1100px;height:800px}pre{white-space:pre-wrap}</style>
<button id="run">Inspect every repaired MakeHuman frame</button><pre id="status">Ready</pre><img id="live-frame" alt="Actual app rendered viewport" style="display:none;max-width:780px;width:100%"><iframe src="../index.html"></iframe>
<script type="module">
const iframe=document.querySelector('iframe'),status=document.querySelector('#status'),raf=()=>new Promise(r=>requestAnimationFrame(r));const root='../assets/ual-library/';const requested=new URLSearchParams(location.search).get('editor');if(requested&&requested!=='makehuman')iframe.src=requested==='legacy'?'../../scene-builder/index.html':'../../scene-builder-2/index.html';
async function json(u){const r=await fetch(u);if(!r.ok)throw Error(u);return r.json();}
async function until(fn){const end=performance.now()+60000;while(!fn()){if(performance.now()>end)throw Error('Editor timeout');await raf();}}
async function post(route,editor,id,frame,data,binary=false){const r=await fetch('/__limb-audit/'+route+'?'+new URLSearchParams({editor,id,frame}),{method:'POST',headers:{'Content-Type':binary?'application/octet-stream':'application/json'},body:binary?data:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json();}
function fittedGroups(data){const names=data.bones.map(b=>b.name),groups={};for(const side of ['l','r'])for(const part of ['arm','leg']){const pattern=part==='arm'?/^(upperarm|lowerarm|hand|thumb|index|middle|ring|pinky)_/:/^(thigh|calf|foot|ball)_/;const ids=new Set(names.map((n,i)=>n.endsWith('_'+side)&&pattern.test(n)?i:-1));const weights=Array.from({length:data.vertices.length/3},(_,i)=>[0,1,2,3].reduce((s,j)=>s+(ids.has(data.skinIndices[i*4+j])?data.skinWeights[i*4+j]:0),0));const faces=[];for(let i=0;i<data.indices.length;i+=3){const f=data.indices.slice(i,i+3);if(f.every(v=>weights[v]>.5))faces.push(f);}groups[part+'_'+side]=faces;}return groups;}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;status.textContent='Loading repaired catalog…';try{
 const initial=await json(root+'limb-repair-batch.json'),all=initial.actions;const motionSet=new URLSearchParams(location.search).has('motion')?new Set((await json('../docs/ual-fit/limb-clearance/motion-review/summary.json')).reviews.map(r=>r.id)):null;const excluded=new URLSearchParams(location.search).has('stable')?new Set((await json(root+'limb-repair-temporal-batch.json')).actions.map(a=>a.id)):new Set();const items=[];for(const row of all){if(motionSet&&!motionSet.has(row.id)||excluded.has(row.id)||new URLSearchParams(location.search).has('clip')&&row.id!==new URLSearchParams(location.search).get('clip'))continue;const audit=await json(root+row.id+'/limb-intersections.json');if(audit.intersectingFrames===0)items.push(row);}const results=[];
 const editors=new URLSearchParams(location.search).has('editor')?[new URLSearchParams(location.search).get('editor')]:['makehuman'];
 for(const editorName of editors){
  if(editorName!=='makehuman')await new Promise(resolve=>{iframe.addEventListener('load',resolve,{once:true});iframe.src=editorName==='legacy'?'../../scene-builder/index.html':'../../scene-builder-2/index.html';});
  await until(()=>editorName==='makehuman'?iframe.contentWindow.mannequinReady:iframe.contentWindow.sceneBuilderEditor);
  const w=iframe.contentWindow,doc=w.document,editor=editorName==='makehuman'?w.mannequinEditor:w.sceneBuilderEditor,THREE=editor.three,model=editor.selected,point=new THREE.Vector3();let groups,legacyMeshes;
  if(editorName==='makehuman'){const data=await json(root+items[0].id+'/model.json');groups=fittedGroups(data);}
  else{groups={};legacyMeshes=[];let offset=0;for(const side of ['l','r'])for(const part of ['arm','leg']){const faces=[];model[side+'_'+part].traverse(mesh=>{if(!mesh.isMesh||!mesh.visible||!mesh.geometry?.attributes.position)return;const a=mesh.geometry.attributes.position,indices=mesh.geometry.index?.array||Array.from({length:a.count},(_,i)=>i);legacyMeshes.push({mesh,offset});for(let i=0;i<indices.length;i+=3)faces.push([offset+indices[i],offset+indices[i+1],offset+indices[i+2]]);offset+=a.count;});groups[part+'_'+side]=faces;}}
  await post('topology',editorName,'',0,groups);
  const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(768,768);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#36363c');scene.add(new THREE.AmbientLight(0xffffff,1.5));const grid=new THREE.GridHelper(12,24,0x797979,0x515151);grid.position.y=-.0001;scene.add(grid);const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,5,3);scene.add(light);const camera=new THREE.PerspectiveCamera(35,1,.01,2000);
  for(const item of items){const id=item.id,fit=await json(root+id+'/fit-report.json'),clipHash=fit.limbClearance?.clipSHA256;const previous=await json('../docs/ual-fit/limb-clearance/batch-app/'+id+'/'+editorName+'/comparison.json').catch(()=>null);if(!new URLSearchParams(location.search).has('force')&&previous?.verificationVersion>=3&&previous.pass&&previous.clipSHA256===clipHash&&(editorName==='makehuman'||previous.legacyClearanceSHA256===fit.legacyClearanceSHA256)){results.push(previous);continue;}const clip=await json(root+id+'/'+id+'-frames.json'),entry=(await json(root+id+'/manifest.json'))[0];doc.querySelector('#btn-pose2').click();await until(()=>doc.querySelector('dialog[open] .pose-thumbnail'));const choice=[...doc.querySelectorAll('dialog[open] .pose-thumbnail')].find(b=>b.title==='UAL'+clip.library+': '+clip.action);if(!choice)throw Error('Missing gallery '+id);choice.click();await until(()=>!doc.querySelector('dialog[open]')&&model.userData.poseFrame?.id===id);const input=doc.querySelector('#animation-frame-panel input[type=number]');await until(()=>!input.disabled);const oracle=editorName==='makehuman'?new Float32Array(await fetch(root+id+'/blender-vertices.f32').then(r=>r.arrayBuffer())):null;let maxError=0,maxFloor=0,bad=0,maxWhere=null,boneMismatch=0,maxBoneMetres=0,maxBoneRotationDegrees=0;let fixedCameraBounds=null;if(editorName==='makehuman'){fixedCameraBounds=new THREE.Box3();const visible=[...new Set(model.mesh.geometry.index.array)],stride=model.mesh.geometry.attributes.position.count*3;for(let f=0;f<clip.frames.length;f++)for(const i of visible)fixedCameraBounds.expandByPoint(new THREE.Vector3().fromArray(oracle,f*stride+i*3));}
   for(let fi=0;fi<clip.frames.length;fi++){const f=clip.frames[fi].frame;input.value=String(f);input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.Event('blur'));await raf();if(model.userData.poseFrame?.frame!==f)throw Error('Frame failed '+id+' '+f);model.updateMatrixWorld(true);editor.renderFrame?.();let positions;
    if(editorName==='makehuman'){const mesh=model.mesh;mesh.skeleton.update();positions=new Float32Array(mesh.geometry.attributes.position.count*3);for(let i=0;i<mesh.geometry.attributes.position.count;i++){point.fromBufferAttribute(mesh.geometry.attributes.position,i);mesh.applyBoneTransform(i,point);point.applyMatrix4(mesh.matrixWorld);positions.set(point.toArray(),i*3);const error=point.distanceTo(new THREE.Vector3().fromArray(oracle,fi*positions.length+i*3));if(error>maxError){maxError=error;maxWhere={frame:f,vertex:i,actual:point.toArray(),expected:Array.from(oracle.slice(fi*positions.length+i*3,fi*positions.length+i*3+3))};}}const visible=new Set(mesh.geometry.index.array);for(const i of visible)maxFloor=Math.max(maxFloor,-positions[i*3+1]);}
    else{positions=new Float32Array(legacyMeshes.reduce((n,o)=>n+o.mesh.geometry.attributes.position.count*3,0));for(const {mesh,offset}of legacyMeshes){const a=mesh.geometry.attributes.position;for(let i=0;i<a.count;i++){point.fromBufferAttribute(a,i).applyMatrix4(mesh.matrixWorld).multiplyScalar(.01);positions.set(point.toArray(),(offset+i)*3);}}}
    if(editorName==='makehuman')for(const [n,b]of Object.entries(clip.frames[fi].bones)){const actual=model.bones[n];const positionError=actual.position.distanceTo(new THREE.Vector3().fromArray(b.position)),rotationError=actual.quaternion.clone().normalize().angleTo(new THREE.Quaternion().fromArray(b.quaternion).normalize());boneMismatch=Math.max(boneMismatch,positionError,rotationError);maxBoneMetres=Math.max(maxBoneMetres,positionError);maxBoneRotationDegrees=Math.max(maxBoneRotationDegrees,THREE.MathUtils.radToDeg(rotationError));}const audit=await post('frame',editorName,id,f,positions.buffer,true);if(!audit.pass)bad++;
    if(new URLSearchParams(location.search).has('motion')||editorName==='legacy'||f===entry.frame||fi===0||fi===clip.frames.length-1){const parent=model.parent;scene.add(model);model.mesh?.computeBoundingBox?.();const bounds=fixedCameraBounds||new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),extent=Math.max(size.x,size.y,size.z);camera.position.copy(center).add(new THREE.Vector3(.15,.12,1).normalize().multiplyScalar(extent*2.4));camera.lookAt(center);renderer.render(scene,camera);const png=renderer.domElement.toDataURL('image/png');parent.add(model);editor.renderFrame?.();if(editor.stage&&f===entry.frame)await post('image',editorName,id,1000+f,{png:editor.stage.renderer.domElement.toDataURL('image/png')});if(editor.stage&&fi===clip.frames.length-1){const live=document.querySelector('#live-frame');live.src=editor.stage.renderer.domElement.toDataURL('image/png');live.style.display='block';}await post('image',editorName,id,f,{png});}
    status.textContent=editorName+' · '+id+' · '+f+' / '+clip.end+' · intersections '+bad;
   }
   const result={verificationVersion:3,id,editor:editorName,scenePlacement:model.matrixWorld.toArray(),meshWorld:model.mesh?.matrixWorld.toArray(),clipSHA256:clipHash,legacyClearanceSHA256:fit.legacyClearanceSHA256,frames:clip.frames.length,maxWhere,boneMismatch,maxBoneMetres,maxBoneRotationDegrees,maxVertexMetres:maxError,maxBodyPenetrationMetres:maxFloor,intersectingFrames:bad,pass:maxError<.0001&&maxFloor<.0001&&maxBoneMetres<.0001&&maxBoneRotationDegrees<.01&&bad===0};await post('metrics',editorName,id,clip.end,result);results.push(result);
  }
  renderer.dispose();renderer.forceContextLoss();editor.stage.renderer.setAnimationLoop(null);editor.stage.renderer.dispose();editor.stage.renderer.forceContextLoss();
 }
 status.textContent=JSON.stringify({clips:items.length,comparisons:results.length,frames:results.reduce((s,r)=>s+r.frames,0),failures:results.filter(r=>!r.pass)},null,2);
}catch(e){status.textContent='FAILED: '+e.stack;}};
</script>
