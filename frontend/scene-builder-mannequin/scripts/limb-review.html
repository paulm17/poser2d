<!doctype html><meta charset="utf-8"><title>Crouch arm clearance · both editors</title>
<style>body{background:#242428;color:white;font:15px system-ui}iframe{width:1100px;height:800px}button{padding:12px}pre{white-space:pre-wrap}</style>
<button id="run">Inspect every frame in both editors</button><pre id="status">Loading…</pre><iframe src="../index.html"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),id='ual1-Crouch_Fwd_L_Loop';const raf=()=>new Promise(r=>requestAnimationFrame(r));
async function until(fn){const end=performance.now()+60000;while(!fn()){if(performance.now()>end)throw Error('Editor timeout');await raf();}}
async function json(u){const r=await fetch(u);if(!r.ok)throw Error(u);return r.json();}
async function save(d){const r=await fetch('http://127.0.0.1:3006',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error(await r.text());}
status.textContent='Ready';
document.querySelector('#run').onclick=async()=>{try{
 for(const editorName of (new URLSearchParams(location.search).has('editor')?[new URLSearchParams(location.search).get('editor')]:['makehuman','legacy','legacy2'])){
  if(editorName!=='makehuman'){await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=editorName==='legacy2'?'../../scene-builder-2/index.html':'../../scene-builder/index.html';});}
  await until(()=>editorName==='makehuman'?frame.contentWindow.mannequinReady:frame.contentWindow.sceneBuilderEditor);
  const w=frame.contentWindow,doc=w.document,editor=editorName==='makehuman'?w.mannequinEditor:w.sceneBuilderEditor,THREE=editor.three,model=editor.selected;
  doc.querySelector('#btn-pose2').click();await until(()=>doc.querySelector('dialog[open] .pose-thumbnail'));const item=[...doc.querySelectorAll('dialog[open] .pose-thumbnail')].find(b=>b.title==='UAL1: Crouch_Fwd_L_Loop');item.click();await until(()=>!doc.querySelector('dialog[open]')&&model.userData.poseFrame?.id===id);
  const input=doc.querySelector('#animation-frame-panel input[type=number]');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,512);renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();scene.background=new THREE.Color('#36363c');scene.add(new THREE.AmbientLight(0xffffff,1.5));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,5,3);scene.add(light);const camera=new THREE.PerspectiveCamera(35,1,.01,2000),point=new THREE.Vector3();
  const modelData=editorName==='makehuman'?await json('../assets/ual-library/'+id+'/model.json'):null;const reference=editorName==='makehuman'?new Float32Array(await fetch('../assets/ual-library/'+id+'/blender-vertices.f32').then(r=>r.arrayBuffer())):null;let maxError=0;
  for(let f=0;f<=60;f++){
   input.value=String(f);input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.Event('blur'));await raf();await raf();if(model.userData.poseFrame.frame!==f)throw Error('Frame mismatch');model.updateMatrixWorld(true);let geometry;
   if(modelData){model.mesh.skeleton.update();const vertices=[];for(let i=0;i<modelData.vertices.length/3;i++){point.fromBufferAttribute(model.mesh.geometry.attributes.position,i);model.mesh.applyBoneTransform(i,point);maxError=Math.max(maxError,point.distanceTo(new THREE.Vector3().fromArray(reference,f*modelData.vertices.length+i*3)));vertices.push(point.toArray());}geometry={vertices,indices:modelData.indices};}
   else{geometry={vertices:[],groups:{}};for(const side of ['l','r'])for(const part of ['arm','leg']){const faces=[];model[side+'_'+part].traverse(mesh=>{if(!mesh.isMesh||!mesh.visible||!mesh.geometry?.attributes.position)return;const start=geometry.vertices.length,a=mesh.geometry.attributes.position;for(let i=0;i<a.count;i++){point.fromBufferAttribute(a,i).applyMatrix4(mesh.matrixWorld).multiplyScalar(.01);geometry.vertices.push(point.toArray());}const indices=mesh.geometry.index?.array||Array.from({length:a.count},(_,i)=>i);for(let i=0;i<indices.length;i+=3)faces.push([start+indices[i],start+indices[i+1],start+indices[i+2]]);});geometry.groups[part+'_'+side]=faces;}}
   const parent=model.parent;scene.add(model);const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),height=Math.max(size.x,size.y,size.z);camera.position.copy(center).add(new THREE.Vector3(.15,.12,1).normalize().multiplyScalar(height*2.8));camera.lookAt(center);renderer.render(scene,camera);const png=renderer.domElement.toDataURL('image/png');parent.add(model);
   await save({editor:editorName,frame:f,geometry,png});status.textContent=editorName+' frame '+f+' / 60';
  }
  const metrics={frames:61,maxVertexMetres:maxError,pass:maxError<.0001};await save({editor:editorName,frame:60,metrics});renderer.dispose();renderer.forceContextLoss();editor.stage.renderer.setAnimationLoop(null);editor.stage.renderer.dispose();editor.stage.renderer.forceContextLoss();
 }
 status.textContent='Captured and inspected all 61 frames in the requested editors.';
}catch(e){status.textContent='FAILED: '+e.stack;}};
</script>
